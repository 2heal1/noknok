services:
  noknok:
    build:
      context: ..
    command: ["gateway", "--host", "0.0.0.0", "--public-url", "https://${NOKNOK_DOMAIN:?Set NOKNOK_DOMAIN}"]
    environment:
      NOKNOK_SERVER_KEY: ${NOKNOK_SERVER_KEY:-}
    restart: unless-stopped
    # The communication service has no persistent volume and no public host port.
  https:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      NOKNOK_DOMAIN: ${NOKNOK_DOMAIN:?Set NOKNOK_DOMAIN}
    volumes:
      - ./Caddyfile.gateway:/etc/caddy/Caddyfile:ro
      - tls-data:/data
      - tls-config:/config
    restart: unless-stopped
volumes:
  # TLS certificates only; no NokNok contacts, subscriptions or transcripts.
  tls-data:
  tls-config:
