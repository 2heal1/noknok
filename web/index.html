<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>NokNok · 通话记录</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="app-header">
    <div class="header-start">
      <button id="sidebarToggle" class="icon-button" type="button" aria-label="打开通话列表" title="通话列表" aria-expanded="false" aria-controls="sidebar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9 5v14M13 9h4M13 13h4"/></svg></button>
      <a id="brandLink" class="brand" href="#" aria-label="NokNok 通话记录"><span class="brand-mark" aria-hidden="true"><i></i><i></i></span><span class="brand-name">NokNok</span></a>
    </div>
    <button id="topbarCall" class="call-switch" type="button" aria-label="查看通话详情与背景" title="通话详情与背景" aria-expanded="false" aria-controls="infoPanel" hidden>
      <span class="call-pair" aria-hidden="true"><span>A</span><span>B</span></span>
      <span class="call-names"><strong id="callerName" class="caller-name"></strong><span class="call-arrow" aria-hidden="true">↔</span><strong id="calleeName" class="callee-name"></strong></span>
      <span id="callState" class="state-badge"></span>
      <svg class="chevron" viewBox="0 0 16 16" aria-hidden="true"><path d="m5 6 3 3 3-3"/></svg>
    </button>
    <div class="header-actions">
      <button id="autoRefresh" class="icon-button refresh-toggle" type="button" aria-label="暂停自动刷新" title="暂停自动刷新" aria-pressed="true"><span class="live-dot" aria-hidden="true"></span><span id="autoRefreshLabel" class="visually-hidden">自动刷新</span></button>
      <button id="toolsToggle" class="icon-button" type="button" aria-label="搜索与导出" title="搜索与导出" aria-expanded="false" aria-controls="toolsPanel"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/></svg></button>
    </div>
  </header>

  <dialog id="sidebar" class="drawer sidebar" aria-labelledby="sidebarTitle">
    <div class="drawer-heading"><div class="sidebar-heading"><h2 id="sidebarTitle">通话</h2><span id="callCount" class="count-pill">0</span></div><button class="icon-button" data-close-panel="sidebar" type="button" aria-label="关闭通话列表" title="关闭"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div>
    <label id="callSearchField" class="search-field"><span class="search-icon" aria-hidden="true"></span><input id="callSearch" type="search" placeholder="搜索目标或参与者" aria-label="搜索通话" autocomplete="off"></label>
    <section id="remoteAccess" class="remote-access" aria-label="打开只读通话" hidden>
      <form id="viewLinkForm" class="view-link-form" autocomplete="off">
        <label for="viewLinkInput">Session</label>
        <input id="viewLinkInput" type="text" placeholder="粘贴 Session" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="viewLinkHint viewLinkError">
        <button class="button button-primary" type="submit">查看通话</button>
        <p id="viewLinkHint">填写邀请中的 Session，也可粘贴查看链接。</p>
        <p id="viewLinkError" class="view-link-error" role="alert" hidden></p>
      </form>
    </section>
    <p id="sidebarCaption" class="sidebar-caption">按最近记录排列</p>
    <div id="listWarnings" class="warnings" hidden></div>
    <nav id="callList" class="call-list" aria-label="选择通话"></nav>
    <div id="listEmpty" class="list-empty" hidden>暂无通话记录</div>
    <footer class="sidebar-footer"><span id="sourceLabel" class="readonly-label">本地记录 · 只读</span><p id="sourceDescription">两端记录按通话合并。这里显示本机已观察到的内容。</p><details id="sourceDetails" class="source-details"><summary>记录位置</summary><code id="sourceDirectory">—</code></details></footer>
  </dialog>

  <main class="workspace">
    <h1 class="visually-hidden">NokNok 通话记录</h1>
    <section class="detail-pane" aria-label="双方通话">
      <div id="emptyDetail" class="empty-detail"><div class="empty-emblem" aria-hidden="true"><span>A</span><i>↔</i><span>B</span></div><h2 id="emptyTitle">打开一段对话</h2><p id="emptyDescription">正在读取本地 NokNok 通话记录。</p><button id="emptyAction" class="button button-primary" type="button">选择通话</button><p id="emptyNote" class="empty-note">此页面只读取本地记录，不连接交换机。</p></div>
      <div id="callDetail" class="call-detail" hidden>
        <div class="conversation-body">
          <div id="messageScroll" class="message-scroll" role="region" tabindex="0" aria-label="通话消息">
            <section id="callPresence" class="call-presence" aria-label="连接状态" hidden>
              <div class="presence-visual" aria-hidden="true"><span class="presence-agent presence-caller">A</span><span class="presence-wire"><i></i><i></i><i></i></span><span class="presence-agent presence-callee">B</span></div>
              <div class="presence-copy"><p id="presenceStatus" class="presence-status" role="status"></p><p id="presenceNote" class="presence-note"></p><time id="presenceExpiry" class="presence-expiry" hidden></time></div>
            </section>
            <div id="messageList" class="message-list" role="list"></div><p id="messagesEmpty" class="messages-empty" hidden></p>
          </div>
          <button id="jumpToLatest" class="button jump-button" type="button" hidden>新消息 ↓</button>
        </div>
      </div>
      <div id="apiError" class="api-error" role="alert" hidden></div>
    </section>
  </main>

  <dialog id="infoPanel" class="drawer info-panel" aria-labelledby="infoTitle">
    <div class="drawer-heading"><h2 id="infoTitle">这通对话</h2><button class="icon-button" data-close-panel="infoPanel" type="button" aria-label="关闭通话详情" title="关闭"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div>
    <div class="panel-content">
      <span id="infoState" class="state-badge info-state"></span>
      <h3 id="callPurpose" class="call-purpose"></h3>
      <div class="call-meta"><span id="callCreated"></span><span id="callShortId"></span></div>
      <div class="participant-sources"><p><span class="role-dot caller-dot" aria-hidden="true"></span>发起端<span id="callerSource"></span></p><p><span class="role-dot callee-dot" aria-hidden="true"></span>接听端<span id="calleeSource"></span></p></div>
      <details id="contextDetails" class="context-details"><summary>通话背景<span id="contextHint"></span></summary><div id="callContext" class="context-content"></div></details>
      <p id="coverageNote" class="coverage-note"></p>
      <div id="detailWarnings" class="warnings" hidden></div>
      <footer class="conversation-footer"><span id="recordNote">本地已观察记录</span><span id="stateNote">状态以最后一次记录为准</span></footer>
    </div>
  </dialog>

  <dialog id="toolsPanel" class="drawer tools-panel" aria-labelledby="toolsTitle">
    <div class="drawer-heading"><h2 id="toolsTitle">搜索与导出</h2><button class="icon-button" data-close-panel="toolsPanel" type="button" aria-label="关闭搜索与导出" title="关闭"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div>
    <div class="panel-content">
      <label class="search-field message-search"><span class="search-icon" aria-hidden="true"></span><input id="messageSearch" type="search" placeholder="搜索这段对话" aria-label="搜索消息" autocomplete="off"></label>
      <div class="filter-row"><select id="roleFilter" aria-label="筛选消息来源"><option value="all">全部来源</option><option value="caller">发起端</option><option value="callee">接听端</option><option value="system">系统事件</option></select><span id="messageCount" class="message-count"></span></div>
      <button id="showResults" class="button button-primary" type="button">查看筛选结果</button>
      <button id="clearFilters" class="button button-quiet" type="button">清除筛选</button>
      <div class="export-actions"><button id="copyConversation" class="button" type="button">复制完整对话</button><button id="downloadConversation" class="button" type="button">下载 Markdown</button></div>
      <div class="refresh-controls"><span id="refreshStatus" class="refresh-status" role="status">正在读取本地记录…</span><button id="refreshButton" class="button button-quiet" type="button">立即刷新</button></div>
    </div>
  </dialog>
  <div id="filterNotice" class="filter-notice" hidden><span id="filterNoticeText"></span><button id="resetFilters" type="button">显示全部 ×</button></div>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
