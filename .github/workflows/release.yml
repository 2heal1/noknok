name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Stable and preview share the registry. Never interrupt an active publish.
concurrency:
  group: noknok-npm-release
  cancel-in-progress: false

jobs:
  stable:
    if: github.repository == '2heal1/noknok' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      published-version: ${{ steps.publish.outputs.version }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Node.js and npm registry
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Pin npm
        run: npm install --global npm@11.16.0
      - name: Set up pnpm
        run: corepack enable && corepack prepare pnpm@10.34.7 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm check
      - name: Build documentation
        run: pnpm --filter @noknok/docs build
      - name: Inspect distributable package
        run: pnpm check:package
      - name: Show package contents
        run: npm pack ./packages/cli --dry-run
      - name: Create or update the release pull request
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # changesets/action@v1 (v1.9.0)
        with:
          version: pnpm version-packages
          title: 'chore: release @noknok/cli'
          commit: 'chore: release @noknok/cli'
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish stable version through npm OIDC
        id: publish
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('packages/cli/package.json', 'utf8'));
          assert.equal(pkg.name, '@noknok/cli');
          assert.match(pkg.version, /^\d+\.\d+\.\d+$/);
          NODE
          if ! npm view @noknok/cli name --registry=https://registry.npmjs.org; then
            echo '::error::Bootstrap the first npm version and configure the release.yml trusted publisher before running an OIDC release.'
            exit 1
          fi
          pnpm release
          version="$(node -p "require('./packages/cli/package.json').version")"
          pnpm exec tsx scripts/verify-npm-release.ts latest
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'Verified stable package: `@noknok/cli@%s`\n' "$version" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy verified stable release
    needs: stable
    if: needs.stable.outputs.published-version != '' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: noknok-production
    permissions:
      contents: read
    steps:
      - name: Check out the released commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
          package-manager-cache: false
      - name: Upgrade hosted service and verify HTTPS health
        env:
          NOKNOK_DEPLOY_VERSION: ${{ needs.stable.outputs.published-version }}
          NOKNOK_DEPLOY_HOST: ${{ vars.NOKNOK_DEPLOY_HOST }}
          NOKNOK_DEPLOY_PORT: ${{ vars.NOKNOK_DEPLOY_PORT }}
          NOKNOK_PUBLIC_URL: ${{ vars.NOKNOK_PUBLIC_URL }}
          NOKNOK_DEPLOY_SSH_KEY: ${{ secrets.NOKNOK_DEPLOY_SSH_KEY }}
          NOKNOK_DEPLOY_KNOWN_HOSTS: ${{ secrets.NOKNOK_DEPLOY_KNOWN_HOSTS }}
        run: node scripts/deploy-hosted.ts

  preview:
    if: github.repository == '2heal1/noknok' && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out selected branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js and npm registry
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Pin npm
        run: npm install --global npm@11.16.0
      - name: Set up pnpm
        run: corepack enable && corepack prepare pnpm@10.34.7 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm check
      - name: Build documentation
        run: pnpm --filter @noknok/docs build
      - name: Require a pending package release
        run: |
          pnpm exec changeset status --output="$RUNNER_TEMP/noknok-release-plan.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          const plan = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'noknok-release-plan.json'), 'utf8'));
          assert.ok(plan.releases.some(release => release.name === '@noknok/cli' && release.type !== 'none'),
            'Preview requires a committed non-empty changeset for @noknok/cli. Add one before dispatching.');
          NODE
      - name: Create an isolated preview version
        run: |
          pnpm exec changeset version --snapshot preview
          pnpm install --lockfile-only --ignore-scripts
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('packages/cli/package.json', 'utf8'));
          assert.equal(pkg.name, '@noknok/cli');
          assert.match(pkg.version, /^\d+\.\d+\.\d+-preview-/);
          NODE
      - name: Rebuild preview artifacts
        run: pnpm build:cli
      - name: Inspect preview package
        run: pnpm check:package
      - name: Show preview package contents
        run: npm pack ./packages/cli --dry-run
      - name: Publish preview through npm OIDC
        run: |
          if ! npm view @noknok/cli name --registry=https://registry.npmjs.org; then
            echo '::error::Bootstrap the first npm version and configure the release.yml trusted publisher before running an OIDC preview.'
            exit 1
          fi
          pnpm release preview
          version="$(node -p "require('./packages/cli/package.json').version")"
          pnpm exec tsx scripts/verify-npm-release.ts preview
          printf 'Verified preview: `@noknok/cli@%s`\n\n' "$version" >> "$GITHUB_STEP_SUMMARY"
          printf 'Try this exact version:\n\n```sh\nnpm exec --yes --package=@noknok/cli@%s -- noknok --help\n```\n' "$version" >> "$GITHUB_STEP_SUMMARY"
