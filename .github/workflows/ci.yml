name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.18.1
          package-manager-cache: false
      - name: Pin npm
        run: npm install --global npm@11.16.0
      - name: Set up pnpm
        run: corepack enable && corepack prepare pnpm@10.34.7 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm check
      - name: Build documentation
        run: pnpm --filter @noknok/docs build
      - name: Inspect distributable package
        run: pnpm check:package
      - name: Show package contents
        run: npm pack ./packages/cli --dry-run
      - name: Build deployment image and verify its CLI
        run: |
          docker build --tag noknok:ci .
          docker run --rm --network none --read-only noknok:ci --version
